name: ci-probe
on:
  push:
    branches: [ci/try-full-suite]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wensai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-test.txt
      - name: Probe
        run: |
          set +e
          python -m pytest tests/test_acceptance.py tests/test_invariants.py -q --tb=short > /tmp/t.log 2>&1
          code=$?
          echo "exit=$code"
          if [ $code -ne 0 ]; then
            grep -aE '^(FAILED|ERROR)' /tmp/t.log | head -20 | sed 's/^/::error::/' || true
            grep -aE 'Error|error:|assert' /tmp/t.log | head -15 | sed 's/^/::error::/' || true
          fi
          exit $code

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (fastapi + sqlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wensai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: wensai/requirements*.txt
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt -r requirements-test.txt
      - name: Test
        run: |
          python -m pytest tests/test_desktop.py tests/test_goal_agent.py \
            tests/test_adapters.py tests/test_acceptance.py tests/test_invariants.py tests/test_credential.py \
            task_b_tests task_c_tests -q

  frontend:
    name: frontend (react + tauri shell)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck & build
        run: npm run build
      - name: Test
        run: npm test

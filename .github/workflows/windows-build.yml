name: windows-build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    name: win installer (nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target

      - name: Backend dependencies
        working-directory: wensai
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt pyinstaller

      - name: Build sidecar (review-api.exe)
        working-directory: wensai
        run: python scripts/build_sidecar.py

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri installer
        working-directory: frontend
        run: npm run desktop:build:connected

      - name: Collect installer
        shell: pwsh
        run: |
          Get-ChildItem -Recurse frontend/src-tauri/target/release/bundle -Include *.exe,*.msi |
            Select-Object FullName, Length | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: wensai-windows-installer
          if-no-files-found: warn
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: frontend/src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
          body: |
            Windows 安装包（未签名）。

            安装后在「设置」里配置 DeepSeek API Key 才能得到真实评审结果；
            不配置时使用离线 Mock，只返回固定示例数据。

